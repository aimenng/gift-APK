name: Supabase migrations

# 手动触发：Actions 页面 → 左侧 "Supabase migrations" → Run workflow → 选 mode。
# 默认的 list 只读，不会改数据库；确认待执行清单后再选 apply。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = 只列出待执行的文件（只读）；apply = 真正执行；bootstrap = 首次接入，把现有文件标记为已应用但不执行'
        type: choice
        options:
          - list
          - apply
          - bootstrap
        default: list

permissions:
  contents: read

# 同一个时间只允许一个迁移任务，避免两次点 Run 并发改同一个库。
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查 Secret 是否配置
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::缺少仓库 Secret SUPABASE_DB_URL。Settings → Secrets and variables → Actions → New repository secret，值用 Supabase 的 Session pooler 连接串。"
            exit 1
          fi

      - name: 确保 psql 可用
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: 执行迁移（${{ inputs.mode }}）
        # 连接串只通过 env 传入，不写进命令行，避免出现在日志里。
        env:
          MODE: ${{ inputs.mode }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/apply-supabase-migrations.sh "$MODE"
